# Omnivex Academy — single-container stack for a shared small VPS.
# Normal use is through ./deploy.sh (build + up + health check).
name: omnivex

services:
  omnivex:
    build:
      context: .
    image: omnivex-academy:latest
    container_name: omnivex
    restart: unless-stopped
    ports:
      # Host port comes from PORT in .env; the container always listens on 3000.
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Persist SQLite + uploads on the named volume below.
      DATA_DIR: /app/data
      DATABASE_URL: /app/data/omnivex.db
    volumes:
      - omnivex-data:/app/data
    # Stay within the box: other apps share this VPS.
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  omnivex-data: